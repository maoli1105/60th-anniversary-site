<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単会活動 | 創立60周年記念式典</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== Header ========== -->
  <header class="site-header">
    <div class="container">
      <div class="site-logo">
        創立60周年記念式典
        <span class="logo-sub">広島県商工会 青年部・女性部連合会</span>
      </div>
      <button class="nav-toggle" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html#program">式次第</a></li>
          <li><a href="index.html#greeting">挨拶</a></li>
          <li><a href="index.html#history">あゆみ</a></li>
          <li><a href="index.html#activities">単会活動</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ========== Unit Hero ========== -->
  <section class="unit-hero">
    <div class="container">
      <span class="unit-tag" id="unit-tag">--</span>
      <h1 class="unit-title" id="unit-title">読み込み中...</h1>
      <p class="unit-area" id="unit-area"></p>
    </div>
  </section>

  <!-- ========== Unit Content ========== -->
  <main class="unit-content">
    <p class="unit-description fade-in" id="unit-description"></p>

    <h2 class="unit-section-title fade-in">活動紹介</h2>
    <div class="unit-gallery" id="unit-gallery">
      <!-- JS で動的生成 -->
    </div>

    <!-- SNS / HP リンク -->
    <div class="unit-links" id="unit-links" style="display:none;">
      <h2 class="unit-section-title fade-in">関連リンク</h2>
      <div class="unit-links-list" id="unit-links-list"></div>
    </div>

    <nav class="unit-nav" id="unit-nav">
      <a href="#" id="nav-prev">&larr; 前の単会</a>
      <a href="index.html#activities">一覧に戻る</a>
      <a href="#" id="nav-next">次の単会 &rarr;</a>
    </nav>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          広島県商工会青年部連合会<br>
          広島県商工会女性部連合会<br>
          創立60周年記念式典
        </div>
        <nav class="footer-nav">
          <ul>
            <li><a href="index.html#program">式次第</a></li>
            <li><a href="index.html#greeting">挨拶</a></li>
            <li><a href="index.html#history">あゆみ</a></li>
            <li><a href="index.html#activities">単会活動</a></li>
          </ul>
        </nav>
      </div>
      <p class="footer-copyright">
        &copy; 2027 広島県商工会青年部連合会・広島県商工会女性部連合会 All Rights Reserved.
      </p>
    </div>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', async () => {

    // ==========================================
    // URL パラメータから単会IDを取得
    // ==========================================
    const params = new URLSearchParams(window.location.search);
    const unitId = params.get('id');

    if (!unitId) {
      document.getElementById('unit-title').textContent = '単会が指定されていません';
      return;
    }

    // ==========================================
    // JSON データ読み込み
    // ==========================================
    let units;
    try {
      const res = await fetch('data/units.json');
      units = await res.json();
    } catch (e) {
      document.getElementById('unit-title').textContent = 'データの読み込みに失敗しました';
      return;
    }

    const unitIndex = units.findIndex(u => u.id === unitId);
    const unit = units[unitIndex];

    if (!unit) {
      document.getElementById('unit-title').textContent = '該当する単会が見つかりません';
      return;
    }

    // ==========================================
    // ページ情報を反映
    // ==========================================
    document.title = unit.name + ' | 創立60周年記念式典';

    const tag = document.getElementById('unit-tag');
    tag.textContent = unit.type === 'youth' ? '青年部' : '女性部';
    tag.className = 'unit-tag unit-tag--' + unit.type;

    document.getElementById('unit-title').textContent = unit.name;
    document.getElementById('unit-area').textContent = unit.area;
    document.getElementById('unit-description').textContent = unit.description;

    // ==========================================
    // 活動ギャラリー生成
    // ==========================================
    const gallery = document.getElementById('unit-gallery');

    if (unit.activities && unit.activities.length > 0) {
      unit.activities.forEach((act, i) => {
        const div = document.createElement('div');
        div.className = 'unit-photo fade-in';

        // 写真がある場合は img、なければプレースホルダー
        const hasPhoto = act.photo && !act.photo.includes('placeholder');
        const photoHtml = hasPhoto
          ? '<img src="' + act.photo + '" alt="' + (act.caption || act.title) + '" onerror="this.parentElement.innerHTML=\'<div class=photo-placeholder>写真 ' + (i+1) + '</div>\'">'
          : '<div class="photo-placeholder">写真 ' + (i+1) + '</div>';

        div.innerHTML = photoHtml +
          '<div class="photo-caption">' +
            '<span class="caption-title">' + act.title + '</span>' +
            '<span class="caption-text">' + act.description + '</span>' +
          '</div>';

        gallery.appendChild(div);
      });
    } else {
      // 活動データ未登録
      for (let i = 0; i < 5; i++) {
        const div = document.createElement('div');
        div.className = 'unit-photo fade-in';
        div.innerHTML = '<div class="photo-placeholder">写真 ' + (i+1) + '</div>' +
          '<div class="photo-caption">' +
            '<span class="caption-title">活動 ' + (i+1) + '</span>' +
            '<span class="caption-text">情報収集中です。</span>' +
          '</div>';
        gallery.appendChild(div);
      }
    }

    // ==========================================
    // 関連リンク
    // ==========================================
    if (unit.links && (unit.links.hp || unit.links.sns)) {
      const linksSection = document.getElementById('unit-links');
      const linksList = document.getElementById('unit-links-list');
      linksSection.style.display = '';

      if (unit.links.hp) {
        const a = document.createElement('a');
        a.href = unit.links.hp;
        a.target = '_blank';
        a.className = 'unit-link-item';
        a.textContent = 'ホームページ';
        linksList.appendChild(a);
      }
      if (unit.links.sns) {
        const a = document.createElement('a');
        a.href = unit.links.sns;
        a.target = '_blank';
        a.className = 'unit-link-item';
        a.textContent = 'SNS';
        linksList.appendChild(a);
      }
    }

    // ==========================================
    // 前後の単会ナビゲーション
    // ==========================================
    const prevUnit = unitIndex > 0 ? units[unitIndex - 1] : null;
    const nextUnit = unitIndex < units.length - 1 ? units[unitIndex + 1] : null;
    const navPrev = document.getElementById('nav-prev');
    const navNext = document.getElementById('nav-next');

    if (prevUnit) {
      navPrev.href = 'unit.html?id=' + prevUnit.id;
      navPrev.textContent = '← ' + prevUnit.name;
    } else {
      navPrev.style.visibility = 'hidden';
    }

    if (nextUnit) {
      navNext.href = 'unit.html?id=' + nextUnit.id;
      navNext.textContent = nextUnit.name + ' →';
    } else {
      navNext.style.visibility = 'hidden';
    }

    // ==========================================
    // スクロールアニメーション
    // ==========================================
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // ==========================================
    // キャプション（スマホ: タップ切替）
    // ==========================================
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouchDevice) {
      document.querySelectorAll('.unit-photo').forEach(photo => {
        photo.addEventListener('click', (e) => {
          document.querySelectorAll('.unit-photo.caption-active').forEach(p => {
            if (p !== photo) p.classList.remove('caption-active');
          });
          photo.classList.toggle('caption-active');
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.unit-photo')) {
          document.querySelectorAll('.unit-photo.caption-active').forEach(p => {
            p.classList.remove('caption-active');
          });
        }
      });
    }

    // ==========================================
    // モバイルナビ
    // ==========================================
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.main-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => nav.classList.toggle('is-open'));
      nav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => nav.classList.remove('is-open'));
      });
    }

    // ==========================================
    // ヘッダーシャドウ
    // ==========================================
    const header = document.querySelector('.site-header');
    if (header) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 100) {
          header.style.background = 'rgba(27, 42, 74, 0.98)';
          header.style.boxShadow = '0 2px 20px rgba(0,0,0,0.15)';
        } else {
          header.style.background = 'rgba(27, 42, 74, 0.95)';
          header.style.boxShadow = 'none';
        }
      });
    }

  });
  </script>
</body>
</html>
